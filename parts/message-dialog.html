<!-- Message dialog + floating button -->
<button class="fab" type="button" data-message-open data-ta="aria-label:common.send_message">
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.2A8 8 0 1 1 21 12z" /></svg
  ><span data-t="common.message_short"></span>
</button>

<dialog
  class="msg"
  id="message-dialog"
  data-mode="chat"
  aria-labelledby="msg-title" data-ta="data-words:msg.words"
 
>
  <aside class="msg__side">
    <div class="msg__orbs" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="msg__hello" aria-hidden="true"><span data-hello data-t="curtain.1"></span></p>
    <div class="msg__intro">
      <h2 id="msg-title" data-t="msg.title"></h2>
      <p data-for="chat" data-t="msg.intro"></p>
      <p data-for="brief" data-t="msg.intro_brief"></p>
    </div>
    <ul class="msg__meta">
      <li>
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm18 2-10 7L2 6"
          /></svg
        ><a class="u" data-ta="href:@links.mailto" data-t="@links.email"></a>
      </li>
      <li>
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" /></svg
        ><span data-t="msg.reply_time"></span>
      </li>
      <li>
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" />
          <circle cx="12" cy="10" r="2.5" /></svg
        ><span data-t="site.city"></span>
      </li>
    </ul>
    <p class="msg__avatar">
      <span class="msg__initials"><span data-t="@site.initials"></span><img class="msg__photo" alt="" width="88" height="88" hidden /><i></i></span><span data-t="site.name"></span>
    </p>
  </aside>
  <div class="msg__main">
    <button class="msg__close" type="button" data-msg-close data-ta="aria-label:common.close">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
    <div class="msg__tabs" role="tablist" data-ta="aria-label:msg.tabs_aria">
      <button class="msg__tab" type="button" role="tab" id="msg-tab-chat" aria-controls="msg-panel-chat" aria-selected="true" data-msg-tab="chat" data-t="msg.tab_chat"></button>
      <button class="msg__tab" type="button" role="tab" id="msg-tab-brief" aria-controls="msg-panel-brief" aria-selected="false" tabindex="-1" data-msg-tab="brief" data-t="msg.tab_brief"></button>
    </div>
    <section class="msg__panel msg__panel--chat" id="msg-panel-chat" role="tabpanel" aria-labelledby="msg-tab-chat" data-panel="chat">
      <div class="chat__thread" data-thread aria-live="polite">
        <p class="bubble bubble--them" data-t="chat.greeting"></p>
      </div>
      <form
        class="chat__form"
        data-chat-form
        novalidate
        data-ta="data-email:@links.email;data-subject:chat.subject;data-reply:chat.reply;data-reply-mail:chat.reply_mail;data-fail:msg.fail;data-sending:msg.sending"
      >
        <div class="chat__who">
          <label class="chat__field"
            ><span data-t="chat.name_label"></span
            ><input name="name" type="text" required autocomplete="name" data-ta="placeholder:chat.name_placeholder;data-error:msg.step1_error"
          /></label>
          <label class="chat__field"
            ><span data-t="chat.email_label"></span
            ><input name="email" type="email" required autocomplete="email" data-ta="placeholder:msg.step2_placeholder;data-error:msg.step2_error"
          /></label>
        </div>
        <div class="chat__compose">
          <textarea
            name="message"
            required
            rows="2"
            maxlength="600"
            data-ta="placeholder:chat.message_placeholder;aria-label:chat.message_label;data-error:chat.err_message"
          ></textarea>
          <button class="chat__send" type="submit" data-ta="aria-label:chat.send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6" /></svg></button>
        </div>
        <p class="msg__error" role="alert" data-chat-error></p>
        <p class="msg__status" role="status" data-chat-status></p>
      </form>
    </section>
    <section class="msg__panel msg__panel--brief" id="msg-panel-brief" role="tabpanel" aria-labelledby="msg-tab-brief" data-panel="brief" hidden>
    <div class="msg__top">
      <div class="msg__progress" aria-hidden="true"></div>
      <p class="msg__count" aria-live="polite"><span data-t="msg.step_word"></span> <span data-current>1</span> <span data-t="msg.of"></span> <span data-total></span></p>
    </div>
    <ul class="msg__trail" data-trail data-ta="aria-label:msg.answers_aria"></ul>
    <form
      class="msg__form"
      data-msg-form
      novalidate data-ta="data-email:@links.email;data-subject:msg.subject_brief;data-ok:msg.ok;data-ok-mail:msg.ok_mail;data-fail:msg.fail;data-sending:msg.sending;data-done-title:msg.done_title"
     
     
     
     
     
     
    >
      <div class="msg__steps">
        <div class="msg__step" data-step data-ta="data-label:msg.step1_label;data-error:msg.step1_error">
          <h3 class="msg__q" id="mq1" data-t="msg.step1_q"></h3>
          <div class="msg__field">
            <input
              name="name"
              type="text"
              required
              autocomplete="name"
             
              aria-labelledby="mq1"
              aria-describedby="me1" data-ta="placeholder:msg.step1_placeholder"
            />
          </div>
          <p class="msg__error" id="me1" role="alert"></p>
        </div>
        <div class="msg__step" data-step data-ta="data-label:msg.step2_label;data-error:msg.step2_error">
          <h3 class="msg__q" id="mq2" data-t="msg.step2_q"></h3>
          <div class="msg__field">
            <input
              name="email"
              type="email"
              required
              autocomplete="email"
             
              aria-labelledby="mq2"
              aria-describedby="me2" data-ta="placeholder:msg.step2_placeholder"
            />
          </div>
          <p class="msg__error" id="me2" role="alert"></p>
        </div>
        <fieldset class="msg__step" data-step data-ta="data-label:msg.step3_label">
          <legend class="msg__q" data-t="msg.step3_q"></legend>
          <div class="msg__opts">
            <label class="opt"
              ><input type="checkbox" name="topics" data-ta="value:msg.opt_website" /><span data-t="msg.opt_website"></span></label
            ><label class="opt"
              ><input type="checkbox" name="topics" data-ta="value:msg.opt_app" /><span data-t="msg.opt_app"></span></label
            ><label class="opt"
              ><input type="checkbox" name="topics" data-ta="value:msg.opt_uiux" /><span data-t="msg.opt_uiux"
                ></span
              ></label
            ><label class="opt"
              ><input type="checkbox" name="topics" data-ta="value:msg.opt_perf" /><span data-t="msg.opt_perf"
                ></span
              ></label
            ><label class="opt"><input type="checkbox" name="topics" data-ta="value:msg.opt_other" /><span data-t="msg.opt_other"></span></label>
          </div>
          <p class="msg__note" data-t="msg.step3_hint"></p>
        </fieldset>
        <fieldset class="msg__step" data-step data-ta="data-label:msg.step4_label">
          <legend class="msg__q" data-t="msg.step4_q"></legend>
          <div class="msg__opts">
            <label class="opt"><input type="radio" name="budget" data-ta="value:msg.tier_1" /><span data-t="msg.tier_1"></span></label
            ><label class="opt"
              ><input type="radio" name="budget" data-ta="value:msg.tier_2" /><span data-t="msg.tier_2"></span></label
            ><label class="opt"
              ><input type="radio" name="budget" data-ta="value:msg.tier_3" /><span data-t="msg.tier_3"></span></label
            ><label class="opt"
              ><input type="radio" name="budget" data-ta="value:msg.opt_unsure" /><span data-t="msg.opt_unsure"></span></label
            >
          </div>
          <p class="msg__note" data-t="msg.optional"></p>
        </fieldset>
        <div
          class="msg__step"
          data-step data-ta="data-label:msg.step5_label;data-error:msg.step5_error"
         
         
        >
          <h3 class="msg__q" id="mq5" data-t="msg.step5_q"></h3>
          <div class="msg__field">
            <textarea
              name="message"
              required
              rows="4"
              maxlength="600"
             
              aria-labelledby="mq5"
              aria-describedby="me5" data-ta="placeholder:msg.step5_placeholder"
            ></textarea
            ><span class="msg__counter" data-counter></span>
          </div>
          <p class="msg__error" id="me5" role="alert"></p>
        </div>
      </div>
      <div class="msg__actions">
        <button class="msg__back" type="button" data-msg-back>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M19 12H5M11 6l-6 6 6 6" /></svg
          ><span data-t="msg.back"></span>
        </button>
        <span
          class="msg__hint"
          data-hint data-ta="data-hint-next:msg.hint_next;data-hint-send:msg.hint_send" data-t="msg.hint_next"
         
         
          ></span
        >
        <button
          class="btn solid msg__next"
          type="submit"
          data-msg-next data-ta="data-label-next:msg.next;data-label-send:common.project_request"
         
         
        >
          <span data-t="msg.next"></span
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>
      <p class="msg__status" role="status" data-status></p>
    </form>
    </section>
    <div class="msg__done" inert>
      <svg class="msg__check" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="24" />
        <path d="M14 27l8 8 16-17" />
      </svg>
      <h3 data-done-title></h3>
      <p data-done-text></p>
      <button class="btn" type="button" data-msg-again data-t="msg.again"></button>
      <div class="msg__burst" aria-hidden="true"></div>
    </div>
  </div>
</dialog>
