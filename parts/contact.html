<!-- Contact -->
<section class="section panel" id="contact" aria-labelledby="contact-h">
  <div class="wrap grid">
    <h2 id="contact-h" class="rail" data-split data-t="nav.contact"></h2>
    <div class="body">
      <p class="lead" data-split data-t="contact.lead"></p>
      <p class="mail" data-reveal>
        <a class="u" data-ta="href:@links.mailto" data-t="@links.email"></a
        ><button
          class="copy"
          type="button"
         
         
          aria-live="polite" data-ta="data-copy:@links.email;data-copied:contact.copied" data-t="contact.copy"
        ></button>
      </p>
      <p class="contact-cta" data-reveal>
        <button class="btn solid" type="button" data-message-open="chat" data-magnetic>
          <span data-t="common.send_message"></span><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
        <button class="btn" type="button" data-message-open="brief" data-magnetic>
          <span data-t="common.project_request"></span><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </p>
      <ul class="social" data-stagger>
        <li data-reveal>
          <a rel="noopener" target="_blank" data-ta="href:@links.github">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
              ></path>
            </svg>
            <span data-t="social.github"></span>
          </a>
        </li>
        <li data-reveal>
          <a rel="noopener" target="_blank" data-ta="href:@links.linkedin">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"
              ></path>
            </svg>
            <span data-t="social.linkedin"></span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</section>
