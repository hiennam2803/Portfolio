<section id="top" class="hero" aria-labelledby="hero-h" data-ta="data-title:hero.section_title">
  <canvas class="field" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="top">
      <div class="main">
        <p class="hello" data-t="hero.hello"></p>
        <h1 id="hero-h">
          <span class="line"> <span style="--i: 0" data-t="hero.h1_line1"></span> </span
          ><span class="line"> <span style="--i: 1" data-t="hero.h1_line2"></span> </span>
        </h1>
        <p class="role" data-t="hero.role"></p>
        <p class="intro" data-t="hero.intro"></p>
        <div class="actions">
          <a class="btn solid" href="#projects" data-magnetic
            ><span data-t="hero.view_projects"></span><svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 12h14M13 6l6 6-6 6"></path></svg
          ></a>
          <a class="btn" href="#contact" data-magnetic data-t="hero.contact"></a>
        </div>
      </div>
      <figure class="portrait">
        <div class="photo">
          <!-- Portrait (4:5): save your photo as images/portrait.webp (or .jpg and change src). Until the file exists, the placeholder shows. -->
          <span class="ph" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="8" width="38" height="32" rx="3" /><circle cx="17" cy="19" r="4" /><path d="M5 34l11-10 8 8 6-6 13 12" /></svg><small data-t="@images.portrait"></small></span>
          <img width="640" height="800" fetchpriority="high" decoding="async" onerror="this.remove()" data-ta="alt:hero.alt_portrait;src:@images.portrait" />
        </div>
        <button class="badge" type="button" data-message-open data-ta="aria-label:common.send_message">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><path id="badge-path" d="M60 60m-46 0a46 46 0 1 1 92 0a46 46 0 1 1-92 0" /></defs>
            <text>
              <textPath href="#badge-path" textLength="284" lengthAdjust="spacing" data-t="hero.badge_ring"></textPath>
            </text>
          </svg>
          <span class="badge__arrow"
            ><svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 12h14M13 6l6 6-6 6" /></svg
          ></span>
        </button>
        <figcaption class="chip"><span class="dot" aria-hidden="true"></span><span data-t="hero.available"></span></figcaption>
      </figure>
    </div>
    <dl class="stats">
      <div>
        <dd data-count data-stat="years"></dd>
        <dt data-t="hero.stat_years"></dt>
      </div>
      <div>
        <dd data-count data-stat="projects"></dd>
        <dt data-t="hero.stat_projects"></dt>
      </div>
      <div>
        <dd data-count data-stat="tech"></dd>
        <dt data-t="hero.stat_tech"></dt>
      </div>
    </dl>
    <a class="scroll" href="#about" data-ta="aria-label:hero.scroll"
      ><span class="track"><i></i></span><span data-t="hero.scroll"></span></a
    >
  </div>
</section>
