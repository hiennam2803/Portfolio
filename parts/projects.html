<!-- Projects: the list is generated from projects.json (data) + project.N.* in languages.json (text), using parts/project.html -->

  <div class="wrap grid">
    <h2 id="projects-h" class="rail" data-split>{{nav.projects}}</h2>
    <div class="body">
      <ul data-stagger>
        {{project_items}}
      </ul>
    </div>
  </div>
</section>
