<!-- About -->
<section class="section" id="about" aria-labelledby="about-h">
  <div class="wrap grid">
    <h2 id="about-h" class="rail" data-split>{{nav.about}}</h2>
    <div class="body">
      <div class="text" data-stagger>
        <p class="lead" data-scrub>{{about.lead}}</p>
        <p class data-reveal>{{about.text}}</p>
      </div>
      <dl data-stagger>
        <div data-reveal>
          <dt>{{about.location_label}}</dt>
          <dd>{{site.city}}</dd>
        </div>
        <div data-reveal>
          <dt>{{about.focus_label}}</dt>
          <dd>{{about.focus_value}}</dd>
        </div>
        <div data-reveal>
          <dt>{{about.languages_label}}</dt>
          <dd>{{about.languages_value}}</dd>
        </div>
      </dl>
    </div>
  </div>
</section>
