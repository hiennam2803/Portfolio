<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Title + description are filled from languages.json (meta.title, meta.description) -->
    <title></title>
    <meta name="description" content="" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#eef1f5" />
    <!-- Set theme + js flag before paint: no flash, no layout shift -->
    <script>
      (function () {
        var d = document.documentElement,
          t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.dataset.theme = t;
        d.classList.add('js');
        try {
          if (sessionStorage.getItem('seen')) d.classList.add('seen');
          else sessionStorage.setItem('seen', '1');
        } catch (e) {}
        // never leave the page hidden if the content fails to load
        setTimeout(function () {
          d.classList.add('ready');
        }, 3000);
      })();
    </script>
    <link
      rel="preload"
      href="fonts/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/jetbrains-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    {{header}}

    <main id="main">{{main}}</main>

    {{footer}} {{dialogs}}

    <script src="js/main.js" defer></script>
  </body>
</html>
