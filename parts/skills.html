<!-- Skills -->

    <h2 id="skills-h" class="rail" data-split>{{nav.skills}}</h2>
    <div class="body">
      <div class="groups" data-stagger>
        <div class="group" data-reveal>
          <h3>{{skills.group.lang}}</h3>
          <ul>
            {{skills_lang}}
          </ul>
        </div>
        <div class="group" data-reveal>
          <h3>{{skills.group.fw}}</h3>
          <ul>
            {{skills_fw}}
          </ul>
        </div>
        <div class="group" data-reveal>
          <h3>{{skills.group.tools}}</h3>
          <ul>
            {{skills_tools}}
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
